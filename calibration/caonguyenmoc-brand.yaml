examples:
- format: blog
  text: Trả lời nhanh Sau khi mở túi, gấp kín miệng túi có van một chiều hoặc chuyển
    sang hũ kín, để nơi khô, mát, tối, tránh xa bếp và cửa sổ nắng. Không cất cà phê
    đang dùng hằng ngày trong tủ lạnh vì cà phê hút ẩm và ám mùi. Cà phê xay nên dùng
    trong 2–4 tuần, nguyên hạt giữ mùi lâu hơn.
  why_it_works: đoạn 'Trả lời nhanh' mở đầu bài — reviewer thay cho đoạn boilerplate
    trang danh mục blog mà bộ trích xuất chọn nhầm
- format: site_copy
  text: 'Trả lời nhanhCao Nguyên Mộc là thương hiệu nông sản gia đình, có xưởng rang
    tại 672 Quang Trung, Đức Cơ, Gia Lai. Mộc bán cà phê rang mộc (nguyên hạt, rang
    xay, túi lọc) và hạt điều (rang muối, rang mộc). Cà phê là Robusta Đức Cơ, chỉ
    hái quả chín, phơi trên giàn, rang sáng và không tẩm bơ, đường hay hương liệu.
    Đơn online được gửi qua Viettel Post từ điểm giao nhận Hà Nội. Hotline, Zalo:
    0395 050 669.'
  why_it_works: đoạn mẫu lấy từ chính site — user duyệt trước khi dùng
- format: site_copy
  text: Cà phê rang mộc là cà phê chỉ có hạt cà phê được rang chín, không thêm bơ,
    đường, nước mắm, rượu, hương liệu hay chất tạo màu, và không trộn bắp, đậu hay
    vỏ cà phê. Vị thơm, đắng, hậu ngọt đến từ chính hạt và kỹ thuật rang.
  why_it_works: đoạn mẫu lấy từ chính site — user duyệt trước khi dùng
