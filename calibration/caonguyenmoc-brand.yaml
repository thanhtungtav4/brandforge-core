brand:
  id: cao-nguyen-moc
  name: Cao Nguyên Mộc
  simulated: false
  version: 1
voice:
  traits:
  - dimension: xưng hô
    position: brand tự xưng 'Mộc', gọi người đọc là 'bạn'
    do: Xưng 'Mộc' như một người quen; gọi người đọc là 'bạn'
    dont: Không 'chúng tôi' / 'quý khách' kiểu doanh nghiệp
  - dimension: mức độ quảng cáo
    position: thấp — hướng dẫn và kể quy trình, ít hô hào
    do: 'Nêu quy trình cụ thể: hái chín, phơi giàn, rang sáng, không tẩm'
    dont: Không dùng siêu cấp tự khen ('ngon nhất', 'tốt nhất') cho sản phẩm của mình
  - dimension: minh bạch
    position: công khai giá, địa chỉ xưởng, chính sách ship/đổi trả ngay trong bài
    do: Ghi giá + quy cách + ngày giá; nêu rõ điều kiện đổi trả
    dont: Không giấu giá sau 'inbox để biết giá'
  - dimension: cấu trúc bài blog
    position: mở đầu bằng mục 'Trả lời nhanh' + mục lục 'Trong bài này'
    do: Tóm tắt câu trả lời ngay đầu bài, sau đó mới giải thích
    dont: Không mở bài bằng giới thiệu dài dòng
  pov: 'brand-as-person: tự xưng ''Mộc'', gọi người đọc là ''bạn'''
  reader_address: bạn
  sentence_rules:
    median_words_default:
    - 11
    - 17
    median_words_by_format: {}
    max_sentence_words: 25
  formatting_rules:
  - Mở bài blog bằng mục 'Trả lời nhanh' tóm tắt đáp án
  - Tiêu đề mục thường đặt dạng câu hỏi
  - Không dùng dấu chấm than trong blog
  banned_terms:
  - ngon nhất việt nam
  - tốt nhất việt nam
  - số 1
  - đẳng cấp thế giới
  - thần dược
  prohibited_claims:
  - chữa mất ngủ
  - trị bệnh
  - chữa tiểu đường
  - đẳng cấp thế giới
  - tốt nhất việt nam
